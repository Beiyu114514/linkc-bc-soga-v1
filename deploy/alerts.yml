# Prometheus alerting rules for linkc-node.
#
# The admin surface (GET /metrics) is served on a Unix socket; see
# docs/monitoring.md for scrape options. Apply with:
#   promtool check rules deploy/alerts.yml
# or wrap it in a PrometheusRule CRD when running the Operator.

groups:
  - name: linkc-node
    rules:
      - alert: LinkCNodeNotReady
        expr: linkc_ready == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "linkc-node {{ $labels.instance }} is not ready"
          description: "The node agent has not finished bootstrap for 5 minutes. Check the journal and panel reachability."

      - alert: LinkCNodeDegraded
        expr: linkc_degraded == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "linkc-node {{ $labels.instance }} is degraded"
          description: "Three or more consecutive panel failures. The data plane keeps serving, but config/user updates are stale."

      - alert: LinkCTrafficBacklog
        expr: linkc_traffic_pending_bytes > 50e6
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "linkc-node {{ $labels.instance }} traffic backlog"
          description: "More than 50MB of traffic is waiting to be reported for 15 minutes. Panel reachability or journal size may be the cause."

      - alert: LinkCAuditBacklog
        expr: linkc_audit_pending > 1000
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "linkc-node {{ $labels.instance }} audit backlog"
          description: "Audit events are not being accepted by the panel for 30 minutes."

      - alert: LinkCNoUsers
        expr: linkc_users == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "linkc-node {{ $labels.instance }} has zero users"
          description: "An empty user list is legal (quota/bandwidth cap), but a prolonged zero may indicate a panel-side problem."

      - alert: LinkCLimitRejectsSpike
        expr: sum without (reason) (increase(linkc_limit_rejects_total[10m])) > 100
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "linkc-node {{ $labels.instance }} limit rejects spike"
          description: "More than 100 TCP/device limit rejections in 10 minutes. Users may be hitting device or connection limits."

      - alert: LinkCAuditBlockedSpike
        expr: increase(linkc_audit_blocked_total[10m]) > 100
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "linkc-node {{ $labels.instance }} audit blocks spike"
          description: "More than 100 audit-rule blocks in 10 minutes. Verify the rule set still matches expectations."
