name: linkc-node
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: LinkC
description: soga-v1 VLESS node agent with embedded Xray-core
license: UNLICENSED
contents:
  - src: dist/linkc-node-linux-amd64
    dst: /usr/local/bin/linkc-node
    file_info:
      mode: 0755
  - src: deploy/linkc-node.service
    dst: /lib/systemd/system/linkc-node.service
  - src: configs/linkc-node.example.yaml
    dst: /etc/linkc-node/config.yaml
    type: config|noreplace
    file_info:
      mode: 0600
  - dst: /var/lib/linkc-node
    type: dir
    file_info:
      mode: 0700
  - dst: /etc/linkc-node
    type: dir
    file_info:
      mode: 0700
