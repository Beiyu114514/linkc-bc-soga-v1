name: linkc-node
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: LinkC
description: soga-v1 VLESS node agent with embedded Xray-core
license: UNLICENSED
depends:
  - passwd
  - libc-bin
overrides:
  rpm:
    depends:
      - shadow-utils
      - glibc-common
scripts:
  preinstall: packaging/preinstall.sh
  postinstall: packaging/postinstall.sh
  preremove: packaging/preremove.sh
  postremove: packaging/postremove.sh
contents:
  - src: dist/linkc-node-linux-${ARCH}
    dst: /usr/local/bin/linkc-node
    # nfpm only expands ${...} in contents when expand is set explicitly.
    expand: true
    file_info:
      mode: 0755
  - src: deploy/linkc-node.service
    dst: /lib/systemd/system/linkc-node.service
  - src: deploy/linkc-node@.service
    dst: /lib/systemd/system/linkc-node@.service
  - src: configs/linkc-node.example.yaml
    dst: /etc/linkc-node/config.yaml
    type: config|noreplace
    file_info:
      mode: 0600
  - dst: /var/lib/linkc-node
    type: dir
    file_info:
      mode: 0700
  - dst: /etc/linkc-node
    type: dir
    file_info:
      mode: 0700
