name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild, e.g. v0.10.0'
        required: true

permissions:
  contents: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0

      - name: Gate (vet + test)
        run: |
          go vet ./...
          go test ./... -count=1

      - name: Build release artifacts
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          make release-artifacts VERSION="$version" DATE="$date"
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="docs/release-notes-${version}.md"
          assets=(dist/*.deb dist/*.rpm dist/linkc-node-linux-* dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            if [ -f "$notes" ]; then
              gh release edit "$TAG" --title "linkc-node $version" --notes-file "$notes"
            else
              gh release edit "$TAG" --title "linkc-node $version"
            fi
          elif [ -f "$notes" ]; then
            gh release create "$TAG" "${assets[@]}" --title "linkc-node $version" --notes-file "$notes"
          else
            gh release create "$TAG" "${assets[@]}" --title "linkc-node $version" --generate-notes
          fi
