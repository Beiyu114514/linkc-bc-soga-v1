name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild, e.g. v0.10.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch tag
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag format: $INPUT_TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify tag ref
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: git rev-parse -q --verify "refs/tags/${INPUT_TAG}" >/dev/null

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Gate (vet + race test)
        run: |
          go vet ./...
          go test -race ./... -count=1

      - name: Install nfpm
        run: |
          set -euo pipefail
          # Prebuilt binary: nfpm v2.49 needs Go >= 1.27.4 to build, and CI
          # pins the toolchain from go.mod (GOTOOLCHAIN=local).
          version=2.49.0
          sha256="2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7"
          mkdir -p "$RUNNER_TEMP/bin"
          tgz="$RUNNER_TEMP/nfpm.tar.gz"
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${version}/nfpm_${version}_Linux_x86_64.tar.gz" -o "$tgz"
          printf '%s  %s\n' "$sha256" "$tgz" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP/bin" -f "$tgz" nfpm
          rm -f "$tgz"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/nfpm" --version

      - name: Build release artifacts
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Explicit targets instead of `make release-artifacts` so older tags
          # (cut before that target existed) can still be rebuilt.
          mkdir -p dist
          make linux-amd64 linux-arm64 VERSION="$version" DATE="$date"
          make package-deb package-rpm VERSION="$version" ARCH=amd64 DATE="$date"
          make package-deb package-rpm VERSION="$version" ARCH=arm64 DATE="$date"
          for document in LICENSE THIRD_PARTY_NOTICES.md; do
            if [ -f "$document" ]; then
              install -m 0644 "$document" dist/
            fi
          done
          (
            cd dist
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\0' |
              sort -z | xargs -0 sha256sum > SHA256SUMS.tmp
            mv SHA256SUMS.tmp SHA256SUMS
          )
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="docs/release-notes-${version}.md"
          assets=(dist/*.deb dist/*.rpm dist/linkc-node-linux-* dist/SHA256SUMS)
          for document in dist/LICENSE dist/THIRD_PARTY_NOTICES.md; do
            if [ -f "$document" ]; then
              assets+=("$document")
            fi
          done
          prerelease_flag=()
          if [[ "$TAG" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            if [ -f "$notes" ]; then
              gh release edit "$TAG" --title "linkc-node $version" "${prerelease_flag[@]}" --notes-file "$notes"
            else
              gh release edit "$TAG" --title "linkc-node $version" "${prerelease_flag[@]}"
            fi
          elif [ -f "$notes" ]; then
            gh release create "$TAG" "${assets[@]}" --title "linkc-node $version" "${prerelease_flag[@]}" --notes-file "$notes"
          else
            gh release create "$TAG" "${assets[@]}" --title "linkc-node $version" "${prerelease_flag[@]}" --generate-notes
          fi
