name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild, e.g. v0.10.0'
        required: true

permissions:
  contents: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Gate (vet + test)
        run: |
          go vet ./...
          go test ./... -count=1

      - name: Install nfpm
        run: |
          set -euo pipefail
          # Prebuilt binary: nfpm v2.49 needs Go >= 1.27.4 to build, and CI
          # pins the toolchain from go.mod (GOTOOLCHAIN=local).
          version=2.49.0
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${version}/nfpm_${version}_Linux_x86_64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" nfpm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/nfpm" --version

      - name: Build release artifacts
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Explicit targets instead of `make release-artifacts` so older tags
          # (cut before that target existed) can still be rebuilt.
          mkdir -p dist
          make linux-amd64 linux-arm64 VERSION="$version" DATE="$date"
          make package-deb package-rpm VERSION="$version" ARCH=amd64 DATE="$date"
          make package-deb package-rpm VERSION="$version" ARCH=arm64 DATE="$date"
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="docs/release-notes-${version}.md"
          assets=(dist/*.deb dist/*.rpm dist/linkc-node-linux-* dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            if [ -f "$notes" ]; then
              gh release edit "$TAG" --title "linkc-node $version" --notes-file "$notes"
            else
              gh release edit "$TAG" --title "linkc-node $version"
            fi
          elif [ -f "$notes" ]; then
            gh release create "$TAG" "${assets[@]}" --title "linkc-node $version" --notes-file "$notes"
          else
            gh release create "$TAG" "${assets[@]}" --title "linkc-node $version" --generate-notes
          fi
