name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -count=1

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./... -count=1

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: python compile
        run: python3 -m compileall -q scripts/docker_launcher.py scripts/test_docker_launcher.py
      - name: launcher unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: shell syntax & cli help
        run: |
          bash -n scripts/docker-launch.sh
          python3 scripts/docker_launcher.py --help >/dev/null
          sh -n packaging/preinstall.sh packaging/postinstall.sh packaging/preremove.sh packaging/postremove.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile linux/amd64 + linux/arm64
        run: make linux-amd64 linux-arm64 VERSION=ci
      - run: ls -lh dist
