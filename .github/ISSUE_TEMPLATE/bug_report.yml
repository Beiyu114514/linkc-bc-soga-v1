name: Bug report
description: Report a reproducible defect in linkc-node.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, UUIDs, private keys, customer data, or production configuration.
        Security vulnerabilities must be reported through the Security link instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release version, image digest, or commit SHA.
      placeholder: "0.12.0"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - systemd package
        - quickstart script
        - Docker
        - Foreground binary
        - Built from source
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, systemd/Docker version, and panel version.
      placeholder: "Debian 13, amd64, SSPanel-UIM ..., SogaController ..."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use redacted configuration and the smallest reliable reproduction.
      placeholder: |
        1. Configure ...
        2. Start ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and customer data before pasting logs.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and release notes.
          required: true
        - label: I removed all secrets and customer data from this report.
          required: true
